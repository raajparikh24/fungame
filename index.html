<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raj & Devanshi — Live Game</title><style>
:root{font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#34283d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#fff1f4,#f0edff);padding:22px 13px}.wrap{max-width:590px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.brand{font-size:14px;font-weight:800;color:#a04377}.badge{background:#fff;border:1px solid #eadbe5;border-radius:30px;padding:8px 12px;font-size:12px;font-weight:700}.card{background:#fff;border-radius:23px;padding:25px 22px;box-shadow:0 12px 40px #5d2d4714}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#a04377;font-weight:800}h1{font-size:29px;line-height:1.2;margin:10px 0 14px}h2{font-size:22px;line-height:1.35;margin:12px 0 18px}p{color:#706174;line-height:1.55}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #7745bd;outline-offset:2px}.option{display:block;width:100%;text-align:left;border:2px solid #ecdfeb;border-radius:13px;background:#fff;padding:14px 13px;margin:8px 0;font-size:15px;color:#3d3042;min-height:50px}.option.selected{border-color:#ab4980;background:#fff0f7;font-weight:700}.option.correct{border-color:#3c9c76;background:#eaf9f1}.option.wrong{border-color:#c76870;background:#fff0f1}.option:disabled{cursor:default}.primary{background:#a5417b;color:white;border:0;border-radius:13px;padding:15px 18px;font-weight:800;min-height:48px;width:100%;margin-top:13px}.primary:disabled{background:#bfb4bf;cursor:not-allowed}.secondary{background:#f7eef5;color:#82375e;border:0;border-radius:13px;padding:13px 16px;font-weight:700}.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 18px}.score>div{background:#f9f2f8;border-radius:14px;padding:13px;text-align:center}.score strong{font-size:23px;display:block}.progress{height:7px;border-radius:10px;background:#f1e4ed;overflow:hidden;margin-bottom:18px}.bar{height:100%;background:#ad5183;transition:width .2s}.notice{border-radius:13px;background:#f8f3ff;padding:13px 14px;color:#604d72;font-size:14px;margin:15px 0}.reveal{background:#effaf3;border-radius:14px;padding:15px;margin:12px 0}.small{font-size:13px;color:#74677a}.foot{margin-top:16px;text-align:center;font-size:12px;color:#806c80}.hidden{display:none!important}input{width:100%;padding:14px;border:2px solid #ecdfeb;border-radius:12px;font:inherit;margin:8px 0;font-size:16px}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.status{font-size:13px;color:#806c80;margin:12px 0;overflow-wrap:anywhere}.muted{opacity:.7}</style></head><body><div class="wrap"><div class="top"><div class="brand">♡ Raj & Devanshi</div><div class="badge" id="badge">Live · 25 questions</div></div><div class="card"><div id="score" class="score hidden"><div>Raj <strong id="rajScore">0</strong></div><div>Devanshi <strong id="devScore">0</strong></div></div><div id="progress" class="progress hidden"><div id="bar" class="bar"></div></div><div id="screen"><h1>Our little guessing game 👀</h1><p>25 questions · 2 rounds · 10 points for every correct guess.</p><p id="loading">Connecting securely…</p></div><div class="status" id="status" aria-live="polite"></div></div><div class="foot">Same room, two phones, plenty of laughs ✨</div></div><script type="module">

const firebaseConfig={"apiKey": "AIzaSyBFGdOws9AWlbTee7JgVJMTAOQZmxPzRBw", "authDomain": "fungame-68412.firebaseapp.com", "databaseURL": "https://fungame-68412-default-rtdb.firebaseio.com", "projectId": "fungame-68412", "storageBucket": "fungame-68412.firebasestorage.app", "messagingSenderId": "860001005321", "appId": "1:860001005321:web:fe456501cd7f1a73466dd8"};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getDatabase(app);
const questions=[
['Round 1 · Guess My Answer','What would instantly improve my mood after a long day?',['A surprise dessert 🍰','A long walk with good company','A funny phone call','An uninterrupted nap','None of the above']],
['Round 1 · Guess My Answer','If I could disappear for a spontaneous weekend, where would I go?',['A cozy mountain cabin','A big city with amazing food','Somewhere with a beach','A cute little town with cafés','None of the above']],

['Round 1 · Guess My Answer','What would I be most competitive about?',['Board games','Mini golf or bowling','Who picks the better restaurant','Remembering tiny details','None of the above']],

['Round 1 · Guess My Answer','What am I most likely to overthink?',['What to wear','A text message','Where to eat','Whether I forgot something','None of the above']],
['Round 1 · Guess My Answer','If I won a free class, which would I try?',['Salsa dancing','Pottery','Cooking','Photography','None of the above']],

['Round 2 · A Little Flirty','What is the cutest small gesture?',['Remembering my coffee order','Checking that I got home safely','Sending a song that reminded you of me','Saving the last bite for me','None of the above']],
['Round 2 · A Little Flirty','If we went to an amusement park, what would I do first?',['Head straight for the biggest roller coaster','Convince you to try the scariest ride','Find the food stalls','Start with the cute, easy rides','None of the above']],

['Round 2 · A Little Flirty','Which two-person challenge sounds most fun?',['Cook the same recipe on video','Make each other a playlist','Pick each other’s dessert','Compete at an arcade','None of the above']],
['Round 2 · A Little Flirty','What would make me want a second date?',['Easy conversation','Lots of laughter','Thoughtfulness','A surprising shared interest','None of the above']],
['Round 2 · A Little Flirty','If we had a free evening together, I would choose…',['An Italian dinner','Dessert-hopping','A movie and snacks','A spontaneous little adventure','None of the above']],
['Round 2 · A Little Flirty','If we switched lives for a day, what would I struggle with most?',['Following your morning routine','Keeping up with your daily schedule','Getting used to your food preferences','Dealing with myself from your perspective 😂','None of the above']],
['Round 2 · A Little Flirty','If I had to pick our unofficial competition, it would be…',['Who can make the other laugh first','Who chooses better food','Who remembers more details','Who is more stubborn','None of the above']],
['Round 2 · A Little Flirty','What would be my ideal ending to a really good date?',['A long walk','A sweet hug','One more dessert stop','Already planning the next one','None of the above']],
['Round 2 · A Little Flirty','If we were characters in a rom-com, what would our storyline be?',['Friends who accidentally fall for each other','Two people who keep teasing each other','A spontaneous adventure that goes hilariously wrong','Two people who take forever to admit they like each other 👀','None of the above']]
];
const $=id=>document.getElementById(id);const screen=$('screen');
let uid=null,roomId=null,me=null,room=null,unsubscribe=null,selection=-1,busy=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roomRef=()=>ref(db,'rooms/'+roomId);
function error(e){$('status').textContent=(e&&e.message)||String(e);busy=false}
function button(label,fn){const b=document.createElement('button');b.className='primary';b.textContent=label;b.addEventListener('click',async()=>{if(busy)return;busy=true;b.disabled=true;try{await fn()}catch(e){error(e)}finally{busy=false;b.disabled=false}});screen.append(b);return b}
function showLobby(){roomId=null;room=null;me=null;$('score').classList.add('hidden');$('progress').classList.add('hidden');$('badge').textContent='Live · 25 questions';screen.innerHTML='<div class="eyebrow">A little adventure</div><h1>How well do we know each other? 👀</h1><p>Choose your name, then create or join the same room.</p><label for="player">I am</label><select id="player" class="option"><option value="Raj">Raj</option><option value="Devanshi">Devanshi</option></select><label for="code">Room code (only needed to join)</label><input id="code" maxlength="16" placeholder="Enter room code" autocapitalize="characters"><div class="notice">Each player uses their own phone. Keep this tab open while playing.</div>';
button('Create a room ✨',async()=>{me=$('player').value;const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const bytes=crypto.getRandomValues(new Uint8Array(10));roomId=Array.from(bytes,x=>alphabet[x%alphabet.length]).join('');await set(roomRef(),{createdBy:uid,createdAt:Date.now(),members:{[uid]:me},index:0,phase:'answer',scores:{Raj:0,Devanshi:0}});watch()});
button('Join existing room →',async()=>{me=$('player').value;const code=$('code').value.trim().toUpperCase();if(!/^[A-Z2-9]{10}$/.test(code))throw Error('Enter the 10-character room code.');roomId=code;const snap=await get(roomRef());if(!snap.exists())throw Error('Room not found. Check the code.');const data=snap.val();if(Object.values(data.members||{}).includes(me)&&data.members[uid]!==me)throw Error(me+' is already in this room.');if(Object.keys(data.members||{}).length>=2&&!data.members[uid])throw Error('This room already has two players.');await set(ref(db,'rooms/'+roomId+'/members/'+uid),me);watch()});}
function watch(){if(unsubscribe)unsubscribe();$('status').textContent='';unsubscribe=onValue(roomRef(),s=>{if(!s.exists()){error('Room no longer exists');return}room=s.val();render()},error)}
function roles(){return {answerer:room.index%2===0?'Devanshi':'Raj',guesser:room.index%2===0?'Raj':'Devanshi'}}
function render(){if(!room)return;selection=-1;const members=Object.values(room.members||{});const count=members.length;$('score').classList.remove('hidden');$('progress').classList.remove('hidden');$('rajScore').textContent=room.scores?.Raj||0;$('devScore').textContent=room.scores?.Devanshi||0;$('bar').style.width=Math.min(100,((room.index+1)/questions.length)*100)+'%';$('badge').textContent='Question '+Math.min(room.index+1,25)+' / 25';screen.innerHTML='';if(count<2){screen.innerHTML='<div class="eyebrow">Room ready</div><h1>Waiting for the other player… 💌</h1><p>Send this room code to the other person:</p><h1 style="letter-spacing:.14em;overflow-wrap:anywhere">'+esc(roomId)+'</h1><p class="small">Both open the same GitHub Pages link. The other person selects their name and taps Join.</p>';return}
if(room.index>=questions.length){const a=room.scores?.Raj||0,b=room.scores?.Devanshi||0;screen.innerHTML='<div class="eyebrow">Final reveal</div><h1>'+(a===b?'It’s a tie! 🤝':a>b?'Raj wins! 🏆':'Devanshi wins! 🏆')+'</h1><p>Raj: '+a+' · Devanshi: '+b+'</p><p>Now you have 25 more things to tease each other about 😂</p>';return}
const {answerer,guesser}=roles(),q=questions[room.index],mine=me===answerer;
const heading='<div class="eyebrow">'+esc(q[0])+'</div><h2>'+esc(q[1])+'</h2><p class="small">'+answerer+' answers · '+guesser+' guesses</p>';
if(room.phase==='reveal'){const r=room.result||{};screen.innerHTML=heading+'<div class="reveal"><b>'+answerer+' chose:</b><br>'+esc(q[2][r.answer]||'—')+'</div><div class="notice"><b>'+guesser+' guessed:</b><br>'+esc(q[2][r.guess]||'—')+'</div><h2>'+(r.answer===r.guess?'🎉 Correct! +10 points':'😂 Not this time!')+'</h2><p>Ask why! That’s the best part of the game.</p>';button('Next question →',async()=>{await runTransaction(roomRef(),r=>{if(!r||r.phase!=='reveal')return;r.index++;r.phase='answer';delete r.result;return r})});return}
if(room.phase==='answer'&&!mine){screen.innerHTML=heading+'<div class="notice">🤫 '+answerer+' is secretly choosing an answer. Hang tight!</div>';return}
if(room.phase==='guess'&&mine){screen.innerHTML=heading+'<div class="notice">🔒 Your answer is saved. '+guesser+' is guessing now.</div>';return}
if(room.phase==='waitingReveal'){screen.innerHTML=heading+'<div class="notice">'+(mine?'Your turn to reveal the answer!':'Waiting for '+answerer+' to reveal the answer…')+'</div>';if(mine)button('Reveal answers ✨',async()=>{const [a,g]=await Promise.all([get(ref(db,'privateAnswers/'+roomId+'/'+uid+'/'+room.index)),get(ref(db,'rooms/'+roomId+'/guess'))]);if(!a.exists()||!g.exists())throw Error('Answer or guess missing.');const answer=a.val(),guess=g.val();await runTransaction(roomRef(),r=>{if(!r||r.phase!=='waitingReveal')return;r.result={answer,guess};r.scores[guesser]=(r.scores[guesser]||0)+(answer===guess?10:0);r.phase='reveal';delete r.guess;return r})});return}
if(room.phase==='answer'||room.phase==='guess'){screen.innerHTML=heading+'<p>'+(mine?'Choose your real answer. Only you can read it before reveal.':'What do you think '+answerer+' chose?')+'</p>';q[2].forEach((opt,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+opt;b.addEventListener('click',()=>{selection=i;screen.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('submitChoice').disabled=false});screen.append(b)});const b=button(mine?'Lock my answer 🔒':'Lock my guess 🔒',async()=>{if(selection<0)throw Error('Choose an answer first.');const choice=selection;if(mine){await set(ref(db,'privateAnswers/'+roomId+'/'+uid+'/'+room.index),choice);await runTransaction(roomRef(),r=>{if(!r||r.phase!=='answer')return;r.phase='guess';return r})}else{await update(roomRef(),{guess:choice,phase:'waitingReveal'})}});b.id='submitChoice';b.disabled=true;return}
}
try{await signInAnonymously(auth);onAuthStateChanged(auth,u=>{if(u){uid=u.uid;showLobby()}})}catch(e){screen.innerHTML='<h2>Connection failed</h2><p>Open this game from its GitHub Pages website, not as a local file.</p>';error(e)}
</script></body></html>
